[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-speech-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=1.26,<2", "psutil>=6,<8", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["speech_runtime*", "stt*", "tts*", "speech_eval*"]
