name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: code/backend/api/package-lock.json
      - run: npm ci
      - run: npm run check

  speech-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: node --test ../../frontend/call-client/tests/*.test.mjs
